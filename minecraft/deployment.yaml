---
apiVersion: v1
kind: Namespace
metadata:
  name: minecraft

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mc-pvc 
  namespace: minecraft
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mc-server
  namespace: minecraft
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      containers:
      - name: minecraft
        image: itzg/minecraft-server:latest
        ports:
        - containerPort: 25565
          name: minecraft
          protocol: TCP
        env:
        - name: EULA
          value: "TRUE"
        - name: TYPE
          value: "VANILLA"
        - name: VERSION
          value: "LATEST"
        - name: MEMORY
          value: "2G"
        - name: DIFFICULTY
          value: "normal"
        - name: MAX_PLAYERS
          value: "20"
        - name: ONLINE_MODE
          value: "TRUE"
        - name: SERVER_NAME
          value: "finger"
        - name: MOTD
          value: "good times"
        volumeMounts:
        - name: mc-data
          mountPath: /data
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "3Gi"
            cpu: "2000m"
      volumes:
      - name: mc-data
        persistentVolumeClaim:
          claimName: mc-pvc 

---
apiVersion: v1
kind: Service
metadata:
  name: mc-service
  namespace: minecraft
spec:
  type: NodePort
  selector:
    app: minecraft
  ports:
  - port: 25565
    targetPort: 25565
    nodePort: 30565
    protocol: TCP
    name: minecraft
