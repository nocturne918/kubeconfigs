---
apiVersion: v1
kind: Namespace
metadata:
  name: youtube-downloader

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: youtube-downloads-pvc
  namespace: youtube-downloader
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: youtube-downloader
  namespace: youtube-downloader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: youtube-downloader
  template:
    metadata:
      labels:
        app: youtube-downloader
    spec:
      containers:
      - name: yt-dlp
        image: alexta69/metube:latest
        ports:
        - containerPort: 8081
        volumeMounts:
        - name: downloads
          mountPath: /downloads
        env:
        - name: DOWNLOAD_DIR
          value: "/downloads"
        - name: STATE_DIR
          value: "/downloads/.metube"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: downloads
        persistentVolumeClaim:
          claimName: youtube-downloads-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: youtube-downloader-service
  namespace: youtube-downloader
spec:
  type: NodePort
  selector:
    app: youtube-downloader
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8081
    nodePort: 30995

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: youtube-downloader-ingress
  namespace: youtube-downloader
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: youtube-downloader.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: youtube-downloader-service
            port:
              number: 80
